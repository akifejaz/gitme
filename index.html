<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy — defence-in-depth against XSS / supply-chain
    compromise.

    script-src has no 'unsafe-inline'. Every script we ship is an external
    file (theme-init.js, spa-redirect.js) precisely so we can enforce this.
    Any inline script or `eval()`-style payload from a compromised
    dependency will be blocked by the browser. The one third-party origin
    is gc.zgo.at, which serves the GoatCounter analytics beacon.

    style-src keeps 'unsafe-inline' because React uses `style="…"` props
    on elements. That's a style attribute, not a `<style>` element, and
    the CSP style-src covers both — Tailwind + React need this.

    connect-src is a tight allowlist of the exact hosts the app talks to.
    form-action is 'self' to block a compromised page from redirecting
    form submissions off-site.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' https://api.github.com https://openrouter.ai https://www.google.com https://akifejaz.goatcounter.com;
    img-src 'self' data: https://avatars.githubusercontent.com https://github.com https://www.google.com https://icons.duckduckgo.com https://i1.rgstatic.net https://xcelerium.com https://cloud-v.co https://akifejaz.goatcounter.com;
    font-src 'self' data:;
    style-src 'self' 'unsafe-inline';
    script-src 'self' https://gc.zgo.at;
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  " />
  <!-- X-Content-Type-Options via meta is a hint; GH Pages sends it too. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Pre-hydration theme swap. External file so CSP can be strict.
       Bare relative path — Vite adds the base prefix exactly once for
       both dev and production. -->
  <script src="theme-init.js"></script>
  <!-- GoatCounter analytics: cookieless, no personal data, no consent banner
       required. count.js sends the hit via navigator.sendBeacon() and falls
       back to an image pixel, so BOTH connect-src and img-src must allow
       akifejaz.goatcounter.com. Localhost is ignored by default, so dev
       traffic never pollutes the stats. SPA route changes are counted
       manually in App.jsx. -->
  <script data-goatcounter="https://akifejaz.goatcounter.com/count" async
    src="https://gc.zgo.at/count.js"></script>
  <meta name="description"
    content="GitMe - AI-Powered GitHub Profile Analyzer & Resume Builder. Visualize your developer impact, track contributions, and synthesize professional summaries for recruiters." />
  <meta name="keywords"
    content="GitHub, Profile Analyzer, Developer Portfolio, Resume Builder, Open Source, Impact Tracking, GitHub API, AI, React, Vite" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://akifejaz.dev/" />
  <meta property="og:title" content="GitMe | AI-Powered GitHub Profile Analyzer" />
  <meta property="og:description"
    content="Detailed visualization of your GitHub contributions, AI-synthesized professional summaries, and an integrated CV viewer." />
  <meta property="og:image"
    content="https://akifejaz.dev/gitme_banner.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://akifejaz.dev/" />
  <meta property="twitter:title" content="GitMe | AI-Powered GitHub Profile Analyzer" />
  <meta property="twitter:description"
    content="Visualize your developer impact and synthesize professional summaries with AI." />
  <meta property="twitter:image"
    content="https://akifejaz.dev/gitme_banner.png" />

  <title>GitMe | AI-Powered GitHub Profile Analyzer & Impact Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://api.github.com" />
  <link rel="dns-prefetch" href="https://api.github.com" />
  <!-- SPA deep-link restore. External file so the CSP can keep
       script-src 'self' (no 'unsafe-inline'). Bare relative path — Vite
       adds the base prefix exactly once for both dev and production. -->
  <script src="spa-redirect.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
