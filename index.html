<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy — defence-in-depth against XSS / supply-chain
    compromise.

    script-src is 'self' only (no 'unsafe-inline'). The pre-hydration
    theme script is loaded as an external file (theme-init.js) precisely
    so we can enforce this. Any future inline script or `eval()`-style
    payload from a compromised dependency will be blocked by the browser.

    style-src keeps 'unsafe-inline' because React uses `style="…"` props
    on elements. That's a style attribute, not a `<style>` element, and
    the CSP style-src covers both — Tailwind + React need this.

    connect-src is a tight allowlist of the exact hosts the app talks to.
    form-action is 'self' to block a compromised page from redirecting
    form submissions off-site.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' https://api.github.com https://openrouter.ai https://www.google.com;
    img-src 'self' data: https://avatars.githubusercontent.com https://github.com https://www.google.com https://i1.rgstatic.net;
    font-src 'self' data:;
    style-src 'self' 'unsafe-inline';
    script-src 'self';
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  " />
  <!-- X-Content-Type-Options via meta is a hint; GH Pages sends it too. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Pre-hydration theme swap. External file so CSP can be strict.
       Bare relative path — Vite adds the base prefix exactly once for
       both dev and production. -->
  <script src="theme-init.js"></script>
  <meta name="description"
    content="GitMe - AI-Powered GitHub Profile Analyzer & Resume Builder. Visualize your developer impact, track contributions, and synthesize professional summaries for recruiters." />
  <meta name="keywords"
    content="GitHub, Profile Analyzer, Developer Portfolio, Resume Builder, Open Source, Impact Tracking, GitHub API, AI, React, Vite" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/yourusername/gitme" />
  <meta property="og:title" content="GitMe | AI-Powered GitHub Profile Analyzer" />
  <meta property="og:description"
    content="Detailed visualization of your GitHub contributions, AI-synthesized professional summaries, and an integrated CV viewer." />
  <meta property="og:image"
    content="https://raw.githubusercontent.com/yourusername/gitme/main/public/gitme_banner.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://github.com/yourusername/gitme" />
  <meta property="twitter:title" content="GitMe | AI-Powered GitHub Profile Analyzer" />
  <meta property="twitter:description"
    content="Visualize your developer impact and synthesize professional summaries with AI." />
  <meta property="twitter:image"
    content="https://raw.githubusercontent.com/yourusername/gitme/main/public/gitme_banner.png" />

  <title>GitMe | AI-Powered GitHub Profile Analyzer & Impact Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://api.github.com" />
  <link rel="dns-prefetch" href="https://api.github.com" />
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
    // ----------------------------------------------------------------------
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which will cause the browser to refresh the page without losing
    // the history objects.
    // ----------------------------------------------------------------------
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).filter(function (v) {
          return v.indexOf('p=/') === 0
        })[0];
        if (decoded !== undefined) {
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded.slice(3) + l.hash
          );
        }
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
