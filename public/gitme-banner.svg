<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 216" width="420" height="216" role="img" aria-label="GitMe - Your git-powered portfolio">
  <!--
    Self-contained banner: the dark panel is part of the artwork, so the white
    mark and wordmark stay legible on BOTH GitHub themes. Do not make the
    background transparent - white-on-white would disappear in light mode.
  -->
  <rect width="420" height="216" rx="14" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="419" height="215" rx="13.5" fill="none" stroke="#30363D"/>

  <g transform="translate(18,26) scale(1.3)">
    <path fill="#ffffff" fill-rule="evenodd" d="
M7,2 L8,93 L44,116 L45,77 L54,65 L65,62 L66,54 L81,66 L66,78 L65,70 L55,75 L52,116 L82,99 L106,91 L106,14 L92,17 L91,2 L48,31 Z
M49,31 L60,48 L59,49 L53,49 L53,62 L46,69 L45,68 L45,50 L44,49 L39,49 L38,48 L44,39 L45,36 Z
M98,21 L99,85 L79,92 L62,103 L61,101 L72,90 L91,79 L91,23 Z
    "/>
  </g>

  <text x="190" y="132" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="64" fill="#ffffff">GitMe</text>
  <!-- Sized to leave right-edge margin: Poppins is unavailable when GitHub
       renders this as an image, so the fallback font's wider metrics must
       still fit inside the 420-unit canvas. -->
  <text x="192" y="160" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="11" letter-spacing="0.5" fill="#ffffff">YOUR GIT-POWERED PORTFOLIO.</text>
</svg>
