<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages serves this file for every path that is not a real file,
      which on a SPA means every deep link (/home, /profile) and every refresh
      away from "/". It is therefore a real, user-visible document, not just a
      redirect stub: it needs the same icon, title and theme as index.html, or
      the tab shows a blank favicon and a white flash before the redirect runs.
    -->
    <title>GitMe | Akif Ejaz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Root-absolute so it resolves from any path depth. -->
    <script src="/theme-init.js"></script>
    <style>
        html { background: #0d1117; }
        html.light { background: #ffffff; }
    </style>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        // ----------------------------------------------------------------------
        // This script takes the current url and converts the path and query
        // string into just a query string, and then redirects the browser
        // to the new url with only a query string and hash fragment,
        // e.g. http://www.foo.tld/one/two?a=b#c --> http://www.foo.tld/?p=/one/two&q=a=b#c
        // ----------------------------------------------------------------------

        // This part of the script is for use on GitHub Pages
        var pathSegmentsToKeep = 0;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
